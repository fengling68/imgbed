<style>
  :root {
    --bg: #f7f7f8;
    --surface: #fff;
    --border: #e5e5e7;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --accent: #2f6feb;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1c;
      --surface: #242427;
      --border: #35353a;
      --text: #ececee;
      --muted: #98989e;
      --accent: #5b8cff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }

  /* ---------------- 筛选区 ---------------- */

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  /* 文字标题 + 可横向滚动的标签行 */
  .tag-line {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
  }

  .tag-line__label {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    /* 与标签的文字左边缘对齐 */
    min-width: 3.5rem;
  }

  .tag-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;      /* 标签过多时横向滚动 */
    scrollbar-width: thin;
    padding-bottom: 2px;
    min-width: 0;
  }
  .tag-row::-webkit-scrollbar { height: 4px; }
  .tag-row::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .tag {
    flex-shrink: 0;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: all .12s ease;
  }
  .tag:hover { color: var(--text); }
  .tag.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-basis: 100%;
  }

  .search {
    flex: 1;
    min-width: 160px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  .search:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-clear {
    flex-shrink: 0;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .search-clear:hover { color: var(--text); }

  .stat {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------------- 网格 ---------------- */

  .grid {
    display: grid;
    /* 卡片宽度由 CSS 变量控制，媒体查询负责响应式 */
    grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr));
    /* 间距加大，卡片之间不挤在一起 */
    gap: 20px;
  }
  @media (max-width: 1800px) { .grid { --cols: 8; } }
  @media (max-width: 1500px) { .grid { --cols: 7; } }
  @media (max-width: 1200px) { .grid { --cols: 6; } }
  @media (max-width: 900px)  { .grid { --cols: 4; } }
  @media (max-width: 640px)  { .grid { --cols: 3; } }
  @media (max-width: 420px)  { .grid { --cols: 2; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;        /* 圆角加大 */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* 图片略小于卡片：四周留出呼吸空间，视觉上更清爽 */
    padding: 8px 8px 0;
  }

  .thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--bg);
    border-radius: 10px;        /* 与卡片圆角呼应 */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* 比容器略小，上下左右各留一点空隙 */
    margin: 0 6px;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .ph {
    font-size: 26px;
    opacity: .35;
    user-select: none;
  }
  /* 音视频角标 */
  .badge {
    position: absolute;
    right: 5px;
    bottom: 5px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(0, 0, 0, .62);
    color: #fff;
    font-size: 10px;
    line-height: 1.5;
  }

  .meta {
    padding: 8px 6px 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .meta .name {
    color: var(--text);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 六个复制按钮：双排 */
  .links {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px 6px 8px;
  }
  .links button {
    padding: 3px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    line-height: 1.4;
    cursor: pointer;
    transition: all .1s ease;
  }
  .links button:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .links button:disabled {
    opacity: .35;
    cursor: not-allowed;
  }
  .links button.done {
    border-color: #2ea043;
    color: #2ea043;
  }
  /* 第二排缩略图链接用虚线底区分 */
  .links .thumb-btn {
    border-style: dashed;
  }

  .empty {
    grid-column: 1 / -1;
    padding: 48px 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* 懒加载占位，避免布局跳动 */
  .lazy { opacity: 0; transition: opacity .2s ease; }
  .lazy.on { opacity: 1; }
</style>
</head>
<body>

<div class="filter-bar">
  <!-- 第一行：搜索框占满，视线落点最先在这里 -->
  <div class="filter-row">
    <input class="search" id="search" type="search" placeholder="搜索文件名…" />
    <button class="search-clear" id="searchClear" hidden>清空</button>
    <span class="stat" id="stat"></span>
  </div>

  <!-- 第二行：文件夹标签 + 媒体类型标签，各自带一个文字标题 -->
  <div class="tag-line">
    <span class="tag-line__label">文件夹</span>
    <div class="tag-row" id="folderTags"></div>
  </div>
  <div class="tag-line">
    <span class="tag-line__label">媒体类型</span>
    <div class="tag-row" id="typeTags"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
(function () {

8A%E3%83%AC%E3%83%A4%E3%81%84%E3%82%8D%E3%81%AF%E3%81%AB%E3%81%BB.mp3","name":"花ハ踊レヤいろはにほ.mp3","kind":"audio","size":3988209,"thumb":"","folder":"music"}] || [];

  /*
   * 链接前缀：没配置时退回 './'。
   *
   * 用空串也能工作（urlOf 会直接返回相对路径），但生成的链接
   * 少了 './' 前缀，粘到 Markdown 里看不出它指向哪。'./' 明确
   * 表达「相对当前目录」，在 file:// 与 GitHub Pages 下都成立。
   */
  var BASE = "" || './';

  var TYPE_LABEL = { image: '图片', video: '视频', audio: '音频' };
  var TYPE_ICON  = { image: '🖼', video: '▶', audio: '♪' };

  /*
   * folder 初始为空串 = 根目录；但**标签里不显示「全部」**，
   * 首次进入页面会自动选中第一个文件夹（见 initFolder）。
   */
  var state = { folder: '', type: 'all', q: '' };

  var grid = document.getElementById('grid');
  var stat = document.getElementById('stat');
  var search = document.getElementById('search');
  var searchClear = document.getElementById('searchClear');

  /** 绝对链接：前缀 + 相对路径 */
  function urlOf(f) {
    if (!BASE) return f.rel;
    return BASE.replace(/\/+$/, '') + '/' + String(f.rel).replace(/^\/+/, '');
  }

  function thumbUrlOf(f) {
    return f.thumb ? urlOf({ rel: f.thumb }) : '';
  }

  /* ---------------- 筛选 ---------------- */

  /**
   * 文件夹标签列表。
   *
   * 刻意**不含「全部」**：需求是减少首次进入页面的请求数量 ——
   * 一次展示几千张图会把浏览器请求队列打满。所以只列真实存在的
   * 子文件夹，默认选中第一个。
   */
  function folders() {
    var set = {};
    FILES.forEach(function (f) { if (f.folder) set[f.folder] = 1; });
    return Object.keys(set).sort();
  }

  /** 首个可选的文件夹；没有子目录时退回根目录 */
  function firstFolder() {
    var list = folders();
    return list.length ? list[0] : '';
  }

  /** 图库里真实存在的媒体类型（保持 image → video → audio 的固定顺序） */
  function presentTypes() {
    var set = {};
    FILES.forEach(function (f) { set[f.kind] = 1; });
    return ['image', 'video', 'audio'].filter(function (t) { return set[t]; });
  }

  /** 首个存在的类型；没有则不过滤 */
  function firstType() {
    var list = presentTypes();
    return list.length ? list[0] : 'all';
  }

  function renderTags() {
    var box = document.getElementById('folderTags');
    box.innerHTML = '';
    var list = folders();

    // 整个图床只有根目录文件时，这一行没有意义
    if (!list.length) {
      box.style.display = 'none';
    } else {
      box.style.display = '';
      list.forEach(function (key) {
        var el = document.createElement('span');
        el.className = 'tag' + (state.folder === key ? ' active' : '');
        el.textContent = key;
        el.dataset.folder = key;
        el.title = key;
        el.onclick = function () { state.folder = key; render(); };
        box.appendChild(el);
      });
    }

    /* 类型标签同样去掉「全部」，只列图库里真实存在的类型 */
    var tbox = document.getElementById('typeTags');
    tbox.innerHTML = '';
    var types = presentTypes();
    if (!types.length) {
      tbox.parentElement.style.display = 'none';
    } else {
      tbox.parentElement.style.display = '';
      types.forEach(function (t) {
        var el = document.createElement('span');
        el.className = 'tag' + (state.type === t ? ' active' : '');
        el.textContent = TYPE_LABEL[t];
        el.dataset.type = t;
        el.onclick = function () { state.type = t; render(); };
        tbox.appendChild(el);
      });
    }
  }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return FILES.filter(function (f) {
      if (state.folder && f.folder !== state.folder) return false;
      if (state.type !== 'all' && f.kind !== state.type) return false;
      if (q && f.name.toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  /* ---------------- 复制 ---------------- */

  function copy(text, btn) {
    function done() {
      btn.classList.add('done');
      var old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(function () {
        btn.classList.remove('done');
        btn.textContent = old;
      }, 900);
    }
    // navigator.clipboard 需要安全上下文；file:// 下不可用，退回 execCommand
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { legacy(text, done); });
    } else {
      legacy(text, done);
    }
  }

  function legacy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  }

  /* ---------------- 卡片 ---------------- */

  function linkButton(label, text, isThumb) {
    var b = document.createElement('button');
    b.textContent = label;
    b.title = text;
    if (isThumb) b.className = 'thumb-btn';
    b.onclick = function (e) { e.stopPropagation(); copy(text, b); };
    return b;
  }

  function buildCard(f) {
    var card = document.createElement('div');
    card.className = 'card';

    /* 缩略图区：优先缩略图，没有（或加载失败）才用原图 */
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var tUrl = thumbUrlOf(f);
    var oUrl = urlOf(f);
    var showUrl = tUrl || oUrl;
    if (f.kind === 'image' || tUrl) {
      var img = document.createElement('img');
      img.className = 'lazy';
      img.loading = 'lazy';
      img.alt = f.name;
      img.src = showUrl;
      img.onload = function () { img.classList.add('on'); };
      img.onerror = function () {
        // 缩略图文件缺失 / 加载失败：图片类还能退回原图，
        // 音视频没有原图可退，只能换成占位图标
        if (tUrl && f.kind === 'image') {
          img.onerror = function () {
            img.remove();
            var ph = document.createElement('span');
            ph.className = 'ph';
            ph.textContent = TYPE_ICON[f.kind] || '📄';
            thumb.appendChild(ph);
          };
          img.src = oUrl;
          return;
        }
        img.remove();
        var ph = document.createElement('span');
        ph.className = 'ph';
        ph.textContent = TYPE_ICON[f.kind] || '📄';
        thumb.appendChild(ph);
      };
      thumb.appendChild(img);
    } else {
      var ph = document.createElement('span');
      ph.className = 'ph';
      ph.textContent = TYPE_ICON[f.kind] || '📄';
      thumb.appendChild(ph);
    }
    if (f.kind !== 'image') {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = TYPE_LABEL[f.kind] || '';
      thumb.appendChild(badge);
    }
    card.appendChild(thumb);

    /* 文件名与大小 */
    var meta = document.createElement('div');
    meta.className = 'meta';
    var nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = f.name;
    nm.title = f.rel;
    meta.appendChild(nm);
    meta.appendChild(document.createTextNode(
      (f.size ? (f.size / 1024).toFixed(1) + ' KB' : '') +
      (f.folder ? ' · ' + f.folder : '')
    ));
    card.appendChild(meta);

    /* 六个复制按钮，双排 */
    var links = document.createElement('div');
    links.className = 'links';
    var u = urlOf(f);
    var base = f.name.replace(/\.[^.]+$/, '');
    var ext = (f.name.match(/\.[^.]+$/) || [''])[0];

    links.appendChild(linkButton('HTTP', u, false));
    links.appendChild(linkButton('MD', '![' + base + '](' + u + ')', false));
    links.appendChild(linkButton('IMG', '<img src="' + u + '" alt="' + base + '">', false));

    if (tUrl) {
      links.appendChild(linkButton('缩HTTP', tUrl, true));
      links.appendChild(linkButton('缩MD', '![' + base + '](' + tUrl + ')', true));
      links.appendChild(linkButton('缩IMG', '<img src="' + tUrl + '" alt="' + base + '">', true));
    } else {
      // 无缩略图时置灰而非隐藏，让用户知道「本该有缩略图」
      ['缩HTTP', '缩MD', '缩IMG'].forEach(function (label) {
        var b = document.createElement('button');
        b.textContent = label;
        b.className = 'thumb-btn';
        b.disabled = true;
        b.title = '无缩略图';
        links.appendChild(b);
      });
    }
    card.appendChild(links);

    return card;
  }

  /* ---------------- 渲染 ---------------- */

  function render() {
    var list = visible();
    renderTags();

    stat.textContent = list.length === FILES.length
      ? '共 ' + FILES.length + ' 个文件'
      : '筛选出 ' + list.length + ' / ' + FILES.length + ' 个文件';

    grid.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = FILES.length ? '没有符合条件的文件' : '图床目录里还没有媒体文件';
      grid.appendChild(empty);
      return;
    }

    // 分批插入：一次性 appendChild 上千个节点会长时间阻塞主线程
    var BATCH = 60;
    var i = 0;
    (function next() {
      var end = Math.min(i + BATCH, list.length);
      var frag = document.createDocumentFragment();
      for (; i < end; i++) frag.appendChild(buildCard(list[i]));
      grid.appendChild(frag);
      if (i < list.length) setTimeout(next, 0);
    })();
  }

  search.oninput = function () {
    state.q = search.value;
    searchClear.hidden = !state.q;
    render();
  };
  searchClear.onclick = function () {
    search.value = '';
    state.q = '';
    searchClear.hidden = true;
    render();
  };

  /* 默认落到第一个文件夹与第一个类型：既满足「默认选中第一个标签」，
     又避免了首屏一次加载全部几千张图 */
  state.folder = firstFolder();
  state.type = firstType();

  render();
})();
</script>
</body>
</html>
